name: Build Android APK

# Runs automatically when you push code, OR manually from GitHub
on:
  push:
    branches: [claude/refactor-error-retry-bbj8D]
  workflow_dispatch:

jobs:
  build:
    name: Build APK for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        working-directory: HealthLifeHub/mobile
        run: npm install

      - name: Initialize EAS project (first time setup)
        working-directory: HealthLifeHub/mobile
        run: eas init --non-interactive --force
        continue-on-error: true

      - name: Build Android APK
        working-directory: HealthLifeHub/mobile
        run: eas build --platform android --profile preview --non-interactive
