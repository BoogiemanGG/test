name: Build Android APK

on:
  push:
    branches: [main, claude/refactor-error-retry-bbj8D]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install mobile dependencies
        working-directory: HealthLifeHub/mobile
        run: npm install

      - name: Initialize EAS project
        working-directory: HealthLifeHub/mobile
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        continue-on-error: true

      - name: Build Android APK (queues on Expo servers)
        working-directory: HealthLifeHub/mobile
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://test-9ilf.onrender.com/api

      - name: Build submitted
        run: echo "✅ Build submitted to Expo servers. Check expo.dev/accounts/[your-username]/projects/healthlifehub/builds for your APK download link."
